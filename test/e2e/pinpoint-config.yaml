# Pinpoint C++ Agent - Full-feature Integration Test Configuration
# All available options are enabled for comprehensive testing.

Enable: true

ApplicationName: "it-test-server"
AgentId: "it-test-001"
AgentName: "it-test-agent"

IsContainer: true
EnableCallstackTrace: true

# --- Collector (gRPC) ---
# Host is intentionally supplied through PINPOINT_CPP_COLLECTOR_HOST by the
# runner. Keeping it out of the file makes the collector an explicit runtime
# setting.
Collector:
  AgentPort: 9991
  SpanPort: 9993
  StatPort: 9992
  SpanBatch:
    Size: 8
    FlushIntervalMs: 500
    CollectDeadlineMs: 1000
    MaxConcurrentRequests: 4

# --- Logging ---
Log:
  Level: "info"          # debug / info / warn / error
  FilePath: ""           # stdout/stderr; runner captures one file per process
  MaxFileSize: 50        # MB

# --- Sampling ---
# CounterRate=1 means sample every request (100%).
Sampling:
  Type: "COUNTER"        # COUNTER or PERCENT
  CounterRate: 1         # sample every Nth request
  PercentRate: 100.0     # or sample N% of requests
  NewThroughput: 0       # unlimited new trace throughput
  ContinueThroughput: 0  # unlimited continue throughput

# --- Span ---
Span:
  QueueSize: 4096        # larger queue for stress tests
  MaxEventDepth: 16      # /deep?depth=32 verifies depth overflow safely
  MaxEventSequence: 128  # /wide?width=256 verifies sequence overflow safely
  EventChunkSize: 8      # force multiple PSpanChunk sends in smoke tests

# --- HTTP ---
Http:
  CollectUrlStat: true
  UrlStatLimit: 1024
  UrlStatEnableTrimPath: true
  UrlStatTrimPathDepth: 4
  UrlStatMethodPrefix: true

  Server:
    StatusCodeErrors: ["4xx", "5xx"]
    RecordRequestHeader:
      - "User-Agent"
      - "Content-Type"
      - "Accept"
      - "Host"
      - "X-Request-ID"
      - "X-Forwarded-For"
    RecordRequestCookie:
      - "session_id"
      - "token"
    RecordResponseHeader:
      - "Content-Type"
      - "X-Response-Time"
      - "X-Request-ID"

  Client:
    RecordRequestHeader:
      - "User-Agent"
      - "Content-Type"
      - "Host"
      - "X-Request-ID"
    RecordResponseHeader:
      - "Content-Type"
      - "X-It-Trace-Id"
      - "X-It-Span-Id"

# --- SQL ---
Sql:
  EnableSqlStats: true
  TraceBindValue: true
  MaxBindArgsSize: 2048

# --- Stat ---
Stat:
  Enable: true
  BatchCount: 6
  BatchInterval: 5000    # ms
